<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>【預覽】和色 Zen · arammeta</title>
  <style>
    html, body { margin: 0; background: #1a1a1a; color: #f2f0eb;
      font-family: "Noto Sans TC", -apple-system, sans-serif; }
    .boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .boot .err { color: #d45a6a; margin-top: 12px; max-width: 36rem; }
    .boot .hint { margin-top: 8px; font-size: 12px; color: #91989f; }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div>
      <div>載入正式站殼 + 和色 v4…</div>
      <div class="hint">克制桃紅 accent · 功能色保留 · filter 框/底/字 · 無浮槓</div>
    </div>
  </div>
  <script>
  (async function () {
    /* Tier filter grammar: OP white+gold, T1–T2 桃紅 fill, T3+ muted */
    const TIER = {
      OP: { color: '#c9a227', bg: '#f2f0eb' },
      T1: { color: '#c45c8a', bg: '#c45c8a' },
      T2: { color: '#8a3a5e', bg: '#8a3a5e' },
      T3: { color: '#5b7fd4', bg: '#3a4560' },
      T4: { color: '#91989f', bg: '#353535' },
      T5: { color: '#6e6e6e', bg: '#2c2c2c' },
    };

    /* Gold chrome → restrained gold (functional). Academy black → 墨. */
    const GOLD_MAP = {
      '#f5c518': '#c9a227', '#F5C518': '#c9a227',
      '#f5d780': '#e0c56a', '#F5D780': '#e0c56a',
      '#e0a500': '#a8861a', '#9a7100': '#8a6e14',
      '#ffe9a3': '#e0c56a', '#ffe87a': '#e0c56a',
      '#d99908': '#a8861a', '#231802': '#1a1a1a', '#14110a': '#1a1a1a',
      '#0a0b0d': '#1a1a1a', '#0e151d': '#1a1a1a',
      '#101114': '#2c2c2c', '#0b0d0f': '#121212',
      '#161a20': '#353535', '#1a1d21': '#323232',
      '#1e2329': '#3a3a3a', '#0e1116': '#1a1a1a',
      '#1b2030': '#2c2c2c', '#11151d': '#1a1a1a',
    };

    function rewriteGold(css) {
      let out = css;
      for (const [a, b] of Object.entries(GOLD_MAP)) out = out.split(a).join(b);
      return out;
    }

    function rewriteTierInline(html) {
      return html.replace(
        /data-tier=(['"])(OP|T[1-5])\1\s+style=(['"])([^'"]*)\3/g,
        (m, q1, tier, q2) => {
          const conf = TIER[tier];
          if (!conf) return m;
          return `data-tier=${q1}${tier}${q1} style=${q2}--tier-color:${conf.color}; --tier-bg:${conf.bg};${q2}`;
        }
      );
    }

    const banner = `
<div class="washoku-preview-banner" role="note">
  <div>
    <strong>預覽 · 和色 v4</strong>
    · accent 克制桃紅 · 功能色保留（金/法師藍…）
    · 高勝率/高選用 = filter 白底黑字+框
    · 無浮槓 · <code>noindex</code>
  </div>
  <div class="swatches" aria-hidden="true">
    <span class="swatch" style="background:#1a1a1a" title="墨"></span>
    <span class="swatch" style="background:#2c2c2c" title="消炭"></span>
    <span class="swatch" style="background:#c45c8a" title="accent"></span>
    <span class="swatch" style="background:#c9a227" title="gold"></span>
    <span class="swatch" style="background:#5b7fd4" title="mage"></span>
    <span class="swatch" style="background:#5aaf6a" title="WR"></span>
    <span class="swatch" style="background:#f2f0eb;border-color:#c45c8a" title="filter peak"></span>
  </div>
  <a href="https://arammeta.com/">← 回正式站</a>
</div>`;

    const bootJs = `
<script id="washoku-zen-boot">
(function () {
  const TIER = ${JSON.stringify(TIER)};
  function applyTier(root) {
    (root || document).querySelectorAll('[data-tier]').forEach(el => {
      const conf = TIER[el.getAttribute('data-tier')];
      if (!conf) return;
      el.style.setProperty('--tier-color', conf.color);
      el.style.setProperty('--tier-bg', conf.bg);
    });
  }
  applyTier(document);
  document.addEventListener('DOMContentLoaded', () => applyTier(document));
  new MutationObserver(muts => {
    for (const m of muts) {
      m.addedNodes && m.addedNodes.forEach(n => {
        if (n.nodeType === 1) applyTier(n);
      });
    }
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
<\/script>`;

    function shellCandidates() {
      const host = location.hostname;
      const list = ['https://arammeta.com/', 'https://arammeta.com/index.html'];
      if (host && host !== '127.0.0.1' && host !== 'localhost') {
        list.unshift(location.origin + '/', location.origin + '/index.html');
      }
      return list;
    }

    try {
      const themeUrl = new URL('theme.css?v=20260808g', location.href).href;
      const themeRes = await fetch(themeUrl, { cache: 'no-cache' });
      if (!themeRes.ok) throw new Error('theme.css ' + themeRes.status);
      const theme = await themeRes.text();

      let html = null, used = null, lastErr = null;
      for (const url of shellCandidates()) {
        try {
          const r = await fetch(url, { cache: 'no-cache', mode: 'cors' });
          if (!r.ok) { lastErr = url + ' ' + r.status; continue; }
          const text = await r.text();
          if (!text.includes('site-header') && !text.includes('brand-aram')) {
            lastErr = url + ' missing modern shell';
            continue;
          }
          html = text; used = url; break;
        } catch (e) {
          lastErr = url + ' ' + (e && e.message || e);
        }
      }
      if (!html) throw new Error('no shell: ' + lastErr);

      html = html.replace(/(<style\b[^>]*>)([\s\S]*?)(<\/style>)/i, (_, a, body, c) => a + rewriteGold(body) + c);
      html = rewriteTierInline(html);
      html = html.replace(/<title>[^<]*<\/title>/i, '<title>【預覽】和色 Zen · arammeta</title>');
      if (!/name=["']robots["']/.test(html)) {
        html = html.replace(/<head[^>]*>/i, m => m + '<meta name="robots" content="noindex, nofollow">');
      }
      if (!/<base\s/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, m => m + '<base href="https://arammeta.com/">');
      }

      html = html.replace(/<\/head>/i, `<style id="washoku-zen-theme">\n/* shell: ${used} */\n${theme}\n</style>\n</head>`);
      if (/<body[^>]*>/i.test(html)) {
        html = html.replace(/<body([^>]*)>/i, (m, attrs) => `<body${attrs}>${banner}`);
      }
      html = html.replace(/<\/body>/i, bootJs + '\n</body>');

      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      const el = document.getElementById('boot');
      if (el) {
        el.innerHTML = `<div><div>預覽載入失敗</div><div class="err">${String(err && err.message || err)}</div></div>`;
      }
    }
  })();
  </script>
</body>
</html>
