<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>【預覽】和色 Zen · arammeta</title>
  <style>
    html, body { margin: 0; background: #1c1c1c; color: #fcfaf2;
      font-family: "Noto Sans TC", -apple-system, sans-serif; }
    .boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .boot .err { color: #cb4042; margin-top: 12px; max-width: 36rem; }
    .boot .hint { margin-top: 8px; font-size: 12px; color: #91989f; max-width: 28rem; margin-left: auto; margin-right: auto; }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div>
      <div>載入正式站殼 + NIPPON COLORS 選色…</div>
      <div class="hint">墨／藍墨茶底 · 今様注意 · 常磐勝／赤紅負 · 職業同飽和轉色相 · filter 峰強度</div>
    </div>
  </div>
  <script>
  (async function () {
    /* Tier from library grammar — see PHILOSOPHY.md */
    const TIER = {
      OP: { color: '#d19826', bg: '#fffffb' }, /* 山吹茶框 + 胡粉底 */
      T1: { color: '#d05a6e', bg: '#d05a6e' }, /* 今様 */
      T2: { color: '#8e354a', bg: '#8e354a' }, /* 蘇芳 */
      T3: { color: '#477dae', bg: '#3a4550' }, /* 瑠璃克制 */
      T4: { color: '#91989f', bg: '#434343' }, /* 銀鼠／消炭 */
      T5: { color: '#787d7b', bg: '#373c38' }, /* 素鼠／藍墨茶 */
    };

    /* Academy gold → 山吹茶；冷灰底 → 墨／藍墨茶 */
    const REWRITE = {
      '#f5c518': '#d19826', '#F5C518': '#d19826',
      '#f5d780': '#e0c56a', '#F5D780': '#e0c56a',
      '#e0a500': '#b07a14', '#9a7100': '#8a6e14',
      '#ffe9a3': '#e0c56a', '#ffe87a': '#e0c56a',
      '#d99908': '#b07a14', '#231802': '#1c1c1c', '#14110a': '#1c1c1c',
      '#0a0b0d': '#1c1c1c', '#0e151d': '#1c1c1c',
      '#101114': '#373c38', '#0b0d0f': '#161816',
      '#161a20': '#434343', '#1a1d21': '#3f4440',
      '#1e2329': '#4a4f4b', '#0e1116': '#1c1c1c',
      '#1b2030': '#373c38', '#11151d': '#1c1c1c',
      '#7ddc8a': '#5dac81', '#ff9aa5': '#e87a90',
    };

    function rewrite(css) {
      let out = css;
      for (const [a, b] of Object.entries(REWRITE)) out = out.split(a).join(b);
      return out;
    }

    function rewriteTierInline(html) {
      return html.replace(
        /data-tier=(['"])(OP|T[1-5])\1\s+style=(['"])([^'"]*)\3/g,
        (m, q1, tier, q2) => {
          const conf = TIER[tier];
          if (!conf) return m;
          return `data-tier=${q1}${tier}${q1} style=${q2}--tier-color:${conf.color}; --tier-bg:${conf.bg};${q2}`;
        }
      );
    }

    const banner = `
<div class="washoku-preview-banner" role="note">
  <div>
    <strong>預覽 · NIPPON COLORS</strong>
    · 色庫挑選（非單錨）· 墨／藍墨茶底 · 今様注意 · 常磐／赤紅 · 職業同 S 轉 H
    · filter 峰：胡粉+墨字+框 · <code>noindex</code>
  </div>
  <div class="swatches" aria-hidden="true">
    <span class="swatch" style="background:#1c1c1c" title="墨"></span>
    <span class="swatch" style="background:#373c38" title="藍墨茶"></span>
    <span class="swatch" style="background:#91989f" title="銀鼠"></span>
    <span class="swatch" style="background:#d05a6e" title="今様"></span>
    <span class="swatch" style="background:#d19826" title="山吹茶"></span>
    <span class="swatch" style="background:#1b813e" title="常磐"></span>
    <span class="swatch" style="background:#cb4042" title="赤紅"></span>
    <span class="swatch" style="background:#477dae" title="瑠璃"></span>
    <span class="swatch" style="background:#fffffb;border-color:#d05a6e" title="filter peak"></span>
  </div>
  <a href="https://arammeta.com/">← 回正式站</a>
</div>`;

    const bootJs = `
<script id="washoku-zen-boot">
(function () {
  const TIER = ${JSON.stringify(TIER)};
  function applyTier(root) {
    (root || document).querySelectorAll('[data-tier]').forEach(el => {
      const conf = TIER[el.getAttribute('data-tier')];
      if (!conf) return;
      el.style.setProperty('--tier-color', conf.color);
      el.style.setProperty('--tier-bg', conf.bg);
    });
  }
  applyTier(document);
  document.addEventListener('DOMContentLoaded', () => applyTier(document));
  new MutationObserver(muts => {
    for (const m of muts) {
      m.addedNodes && m.addedNodes.forEach(n => {
        if (n.nodeType === 1) applyTier(n);
      });
    }
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
<\/script>`;

    function shellCandidates() {
      const host = location.hostname;
      const list = ['https://arammeta.com/', 'https://arammeta.com/index.html'];
      if (host && host !== '127.0.0.1' && host !== 'localhost') {
        list.unshift(location.origin + '/', location.origin + '/index.html');
      }
      return list;
    }

    try {
      const themeUrl = new URL('theme.css?v=20260808n', location.href).href;
      const themeRes = await fetch(themeUrl, { cache: 'no-cache' });
      if (!themeRes.ok) throw new Error('theme.css ' + themeRes.status);
      const theme = await themeRes.text();

      let html = null, used = null, lastErr = null;
      for (const url of shellCandidates()) {
        try {
          const r = await fetch(url, { cache: 'no-cache', mode: 'cors' });
          if (!r.ok) { lastErr = url + ' ' + r.status; continue; }
          const text = await r.text();
          if (!text.includes('site-header') && !text.includes('brand-aram')) {
            lastErr = url + ' missing modern shell';
            continue;
          }
          html = text; used = url; break;
        } catch (e) {
          lastErr = url + ' ' + (e && e.message || e);
        }
      }
      if (!html) throw new Error('no shell: ' + lastErr);

      html = html.replace(/(<style\b[^>]*>)([\s\S]*?)(<\/style>)/i, (_, a, body, c) => a + rewrite(body) + c);
      html = rewriteTierInline(html);
      html = html.replace(/<title>[^<]*<\/title>/i, '<title>【預覽】和色 Zen · arammeta</title>');
      if (!/name=["']robots["']/.test(html)) {
        html = html.replace(/<head[^>]*>/i, m => m + '<meta name="robots" content="noindex, nofollow">');
      }
      if (!/<base\s/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, m => m + '<base href="https://arammeta.com/">');
      }

      html = html.replace(/<\/head>/i, `<style id="washoku-zen-theme">\n/* shell: ${used} */\n${theme}\n</style>\n</head>`);
      if (/<body[^>]*>/i.test(html)) {
        html = html.replace(/<body([^>]*)>/i, (m, attrs) => `<body${attrs}>${banner}`);
      }
      html = html.replace(/<\/body>/i, bootJs + '\n</body>');

      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      const el = document.getElementById('boot');
      if (el) {
        el.innerHTML = `<div><div>預覽載入失敗</div><div class="err">${String(err && err.message || err)}</div></div>`;
      }
    }
  })();
  </script>
</body>
</html>
